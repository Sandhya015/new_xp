# XpertIntern API — AWS Lambda + API Gateway (serverless, pay-per-request, no always-on)
# Deploy: from backend/ run  npx serverless deploy --stage dev|staging|production
# Loads backend/.env so RAZORPAY_* / MONGODB_URI / secrets are not wiped as empty on deploy.
service: xpertintern-api
useDotenv: true

provider:
  name: aws
  runtime: python3.11
  region: ap-south-1
  stage: ${opt:stage, 'dev'}
  # Required so Lambda proxy returns for course cover images (JPEG/PNG) are decoded from
  # base64 by API Gateway; otherwise browsers receive corrupted bytes and show a broken image.
  apiGateway:
    binaryMediaTypes:
      # POST /api/admin/uploads/course-media (multipart file + kind). API Gateway defaults
      # to UTF-8 for non-binary types, which corrupts JPEG/MP4 bytes inside the body.
      - multipart/form-data
      - image/jpeg
      - image/jpg
      - image/png
      # GET roster .xlsx / certificate PDF — without these, API Gateway leaves Lambda base64 as text in the body.
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      - application/vnd.ms-excel
      - application/pdf
      - application/octet-stream
      # Do NOT add '*/*' here — it breaks API Gateway CORS OPTIONS preflight (MOCK + binary conflict).
      # Binary downloads use explicit Accept headers in the frontend (adminService / enrollmentService).
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - ses:SendEmail
            - ses:SendRawEmail
          Resource: "*"
        # Object reads/writes on bucket/* — GetObject on a missing key also requires
        # s3:ListBucket on the bucket ARN, otherwise S3 returns AccessDenied (not NoSuchKey).
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:HeadObject
          Resource:
            Fn::Join:
              - ""
              - - "Fn::GetAtt":
                    - CourseMediaBucket
                    - Arn
                - "/*"
        - Effect: Allow
          Action:
            - s3:ListBucket
          Resource:
            Fn::GetAtt:
              - CourseMediaBucket
              - Arn
  environment:
    FLASK_ENV: ${self:provider.stage}
    MONGODB_URI: ${env:MONGODB_URI, ''}
    SECRET_KEY: ${env:SECRET_KEY, ''}
    JWT_SECRET_KEY: ${env:JWT_SECRET_KEY, ''}
    # Must match the Mongo user email allowed to use /api/auth/admin/login (default super admin).
    ADMIN_PANEL_ALLOWED_EMAIL: ${env:ADMIN_PANEL_ALLOWED_EMAIL, 'admin@xpertintern.com'}
    # Strip /dev (stage) from path so Flask sees /api/... not /dev/api/...
    API_GATEWAY_BASE_PATH: ${self:provider.stage}
    # Comma-separated origins; include your frontend URL for CORS
    CORS_ORIGINS: ${env:CORS_ORIGINS, 'http://localhost:5173,http://127.0.0.1:5173,https://www.xpertintern.com,https://xpertintern.com'}
    # Razorpay — export before deploy or set in Lambda Console (never commit secrets)
    RAZORPAY_KEY_ID: ${env:RAZORPAY_KEY_ID, ''}
    RAZORPAY_KEY_SECRET: ${env:RAZORPAY_KEY_SECRET, ''}
    # Cashfree PG — never commit secrets; set before deploy / in Lambda Console
    CASHFREE_CLIENT_ID: ${env:CASHFREE_CLIENT_ID, ''}
    CASHFREE_CLIENT_SECRET: ${env:CASHFREE_CLIENT_SECRET, ''}
    CASHFREE_ENV: ${env:CASHFREE_ENV, 'production'}
    CASHFREE_API_VERSION: ${env:CASHFREE_API_VERSION, '2023-08-01'}
    PUBLIC_APP_URL: ${env:PUBLIC_APP_URL, ''}
    # HTTPS origin for Cashfree return_url if PUBLIC_APP_URL is http (omit when PUBLIC_APP_URL is already https).
    CASHFREE_RETURN_URL_ORIGIN: ${env:CASHFREE_RETURN_URL_ORIGIN, ''}
    # Optional: cashfree | razorpay (empty = Cashfree wins if CF keys exist, else Razorpay)
    PAYMENT_GATEWAY: ${env:PAYMENT_GATEWAY, ''}
    # SMTP (Zoho) — set in Lambda env / SSM; never commit secrets
    SMTP_HOST: ${env:SMTP_HOST, ''}
    SMTP_PORT: ${env:SMTP_PORT, '587'}
    SMTP_USER: ${env:SMTP_USER, ''}
    SMTP_PASSWORD: ${env:SMTP_PASSWORD, ''}
    MAIL_FROM: ${env:MAIL_FROM, 'admin@xpertintern.com'}
    MAIL_FROM_NAME: ${env:MAIL_FROM_NAME, 'XpertIntern'}
    MAIL_REPLY_TO: ${env:MAIL_REPLY_TO, 'contact@xpertintern.com'}
    # Set EMAIL_TRANSPORT=ses and SES_FROM_EMAIL to verified SES identity (same region as Lambda).
    EMAIL_TRANSPORT: ${env:EMAIL_TRANSPORT, 'smtp'}
    SES_FROM_EMAIL: ${env:SES_FROM_EMAIL, ''}
    SES_REGION: ${env:SES_REGION, 'ap-south-1'}
    # Admin POST /api/admin/uploads/course-media (optional overrides; defaults 80 in app config)
    MAX_COURSE_INTRO_UPLOAD_MB: ${env:MAX_COURSE_INTRO_UPLOAD_MB, '80'}
    MAX_COURSE_LESSON_UPLOAD_MB: ${env:MAX_COURSE_LESSON_UPLOAD_MB, '80'}
    MAX_COURSE_STUDY_MATERIAL_UPLOAD_MB: ${env:MAX_COURSE_STUDY_MATERIAL_UPLOAD_MB, '50'}
    # Managed per-stage bucket (see resources); course media uploads + public GET (presigned redirect).
    COURSE_MEDIA_S3_BUCKET:
      Ref: CourseMediaBucket
    COURSE_MEDIA_S3_PREFIX: course-media
  # Optional: restrict to your VPC or keep default (no VPC = simpler, MongoDB Atlas works)
  # vpc: ...

plugins:
  - serverless-wsgi
  - serverless-python-requirements

custom:
  wsgi:
    app: app_wsgi.app
    packRequirements: false
  pythonRequirements:
    slim: true
    strip: true
    layer: true
    dockerizePip: false
    pythonBin: python3
    noDeploy:
      - pytest
      - pytest-cov
      - boto3
      - botocore
      - s3transfer

functions:
  api:
    handler: safe_handler.handler
    # Admin bulk certificate email runs SMTP/SES in the request thread on Lambda (sequential).
    timeout: 60
    # More CPU for JSON encode + PyMongo; helps cold/warm latency vs 256MB.
    memorySize: 512
    layers:
      - Ref: PythonRequirementsLambdaLayer
    package:
      individually: true
      patterns:
        - '!venv/**'
        - '!.venv/**'
        - '!.venv_bak/**'
        - '!venv_bak/**'
        - '!.git/**'
        - '!node_modules/**'
        - '!__pycache__/**'
        - '!*.pyc'
        - '!.env'
        - '!.env.*'
        - '!**/__pycache__/**'
        - '!*.md'
        - '!package-lock.json'
        - 'app/**'
        - 'app_wsgi.py'
        - 'safe_handler.py'
        - 'wsgi_handler.py'
        - 'serverless_wsgi.py'
        - '.serverless-wsgi'
    events:
      - http:
          path: /
          method: ANY
          cors:
            # Comma-separated `origin:` is invalid for multiple sites — use `origins` (Serverless matches request Origin).
            origins:
              - http://localhost:5173
              - http://127.0.0.1:5173
              - https://www.xpertintern.com
              - https://xpertintern.com
              - https://*.vercel.app
              - ${env:FRONTEND_ORIGIN, 'https://www.xpertintern.com'}
            headers:
              - Content-Type
              - Authorization
            allowCredentials: true
            maxAge: 86400
      - http:
          path: /{proxy+}
          method: ANY
          cors:
            origins:
              - http://localhost:5173
              - http://127.0.0.1:5173
              - https://www.xpertintern.com
              - https://xpertintern.com
              - https://*.vercel.app
              - ${env:FRONTEND_ORIGIN, 'https://www.xpertintern.com'}
            headers:
              - Content-Type
              - Authorization
            allowCredentials: true
            maxAge: 86400

# Add CORS headers to error responses (4XX/5XX) so browser doesn't block on error
resources:
  Resources:
    CourseMediaBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
    GatewayResponseDefault4XX:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'https://www.xpertintern.com'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
          gatewayresponse.header.Access-Control-Allow-Credentials: "'true'"
        ResponseType: DEFAULT_4XX
        RestApiId:
          Ref: ApiGatewayRestApi
    GatewayResponseDefault5XX:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'https://www.xpertintern.com'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
          gatewayresponse.header.Access-Control-Allow-Credentials: "'true'"
        ResponseType: DEFAULT_5XX
        RestApiId:
          Ref: ApiGatewayRestApi
